name: Production checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check migrations
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python backend/manage.py test --noinput

      - name: Check production security configuration
        run: python backend/manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-production-check-secret-key-with-more-than-fifty-characters-12345"
          DJANGO_ALLOWED_HOSTS: cars.example.com
          CSRF_TRUSTED_ORIGINS: https://cars.example.com
          MYSQL_DATABASE: ci_config_check
          MYSQL_USER: ci_config_check
          MYSQL_PASSWORD: ci_config_check
          MYSQL_HOST: 127.0.0.1
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.com
          DEFAULT_FROM_EMAIL: Showroom <noreply@example.com>

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Build frontend
        run: npm run build --prefix frontend
